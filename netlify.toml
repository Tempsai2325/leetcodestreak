[build]
  publish = "dist"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/fonts/*"]

[[redirects]]
  from = "/api/wallpaper"
  to = "/.netlify/functions/wallpaper"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
